name: Auto-Sync Google Drive to YOURDREAM WebApp
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: 1. Checkout WebApp Repository
        uses: actions/checkout@v4
      - name: 2. Fetch Latest Payloads from Google Drive Bridge
        env:
          DRIVE_BRIDGE_URL: ${{ secrets.DRIVE_BRIDGE_URL }}
        run: |
          if [ -z "$DRIVE_BRIDGE_URL" ]; then
            echo "DRIVE_BRIDGE_URL not configured yet. Skipping external fetch."
            exit 0
          fi
          curl -sL "$DRIVE_BRIDGE_URL" -o drive_payload.json
          python3 - << 'EOF'
          import json, os, sys
          try:
              with open("drive_payload.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              sys.exit(0)
          for rel_path, content in data.get("files", {}).items():
              if not content or not content.strip():
                  continue
              if rel_path.endswith(".json"):
                  try:
                      json.loads(content)
                  except Exception:
                      continue
              dir_name = os.path.dirname(rel_path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              with open(rel_path, "w", encoding="utf-8") as out:
                  out.write(content)
          EOF
          rm -f drive_payload.json
      - name: 3. Atomic Commit & Push (Zero-Freeze)
        run: |
          git config user.name "YOURDREAM Auto-Publisher Bot"
          git config user.email "bot@yourdream.edu.vn"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-sync): update learning materials from Drive [skip ci]" --no-edit
            git push origin main
          fi
